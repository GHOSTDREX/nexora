# Render Blueprint — deploys AgriNova's backend, frontend, and a managed
# Postgres database together. In the Render dashboard: New -> Blueprint,
# point it at this repo, and it provisions all three services below in one
# pass instead of configuring each by hand.
#
# Service names below (agrinova-backend / agrinova-frontend) become
# subdomains: https://agrinova-backend.onrender.com, etc. If those names are
# already taken on Render, it appends a random suffix instead — if that
# happens, update CORS_ORIGINS, VITE_API_URL and VITE_WS_URL below (or in
# the dashboard after first deploy) to match the actual assigned hostnames.
#
# Secrets marked `sync: false` are NOT stored in this file — set them once
# in the Render dashboard after the first deploy (Environment tab on the
# backend service). Never commit real API keys here.

databases:
  - name: agrinova-db
    plan: free
    databaseName: agrinova
    user: agrinova

services:
  - type: web
    name: agrinova-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agrinova-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://agrinova-frontend.onrender.com
      # Set these in the Render dashboard once you have them — the app
      # degrades gracefully (rule-based chat, "not configured" badges)
      # when any of them are left blank, so none are required to deploy.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AGMARKNET_API_KEY
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false

  - type: web
    name: agrinova-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://agrinova-backend.onrender.com
      - key: VITE_WS_URL
        value: wss://agrinova-backend.onrender.com
    routes:
      # SPA fallback — React Router routes like /dashboard must all resolve
      # to index.html client-side, not 404 from the static file server.
      - type: rewrite
        source: /*
        destination: /index.html
