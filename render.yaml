# Render Blueprint — AgriNova's cloud pieces: a managed Postgres database
# and the frontend static site. In the Render dashboard: New -> Blueprint,
# point it at this repo, and it provisions both in one pass.
#
# There is deliberately NO backend web service here. AgriNova's ESP32
# hardware only sits on your local WiFi — a cloud server can't dial into a
# board behind your home router's NAT, so the backend has to keep running
# where the hardware is (see backend/app/routers/robot.py, camera.py). The
# real setup is: your local backend process (same DATABASE_URL as below, so
# its data lands in this same cloud DB) tunneled to a public HTTPS URL
# (e.g. ngrok), with THIS frontend pointed at that tunnel URL instead of a
# Render-hosted backend. Running a second backend here against the same
# database would just double-write simulator ticks with no hardware access
# to show for it.
#
# After deploying this blueprint:
#   1. Databases -> agrinova-db -> Connect -> copy the External Database URL.
#   2. Put it in your local backend/.env as DATABASE_URL=... and restart the
#      local backend — it now writes to this same cloud Postgres instead of
#      the local SQLite file.
#   3. Update VITE_API_URL / VITE_WS_URL below to your actual tunnel host,
#      then redeploy this blueprint (or edit them in the frontend service's
#      Environment tab directly — no redeploy needed for env-var-only edits
#      on a static site... actually a rebuild IS required since Vite bakes
#      these in at build time, so trigger a manual deploy after editing).

databases:
  - name: agrinova-db
    plan: free
    databaseName: agrinova
    user: agrinova

services:
  - type: web
    name: agrinova-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Replace with your own tunnel host if it ever changes (a paid ngrok
      # domain or a fresh reserved domain won't, a free ephemeral one will).
      - key: VITE_API_URL
        value: https://gratified-harbor-rabid.ngrok-free.dev
      - key: VITE_WS_URL
        value: wss://gratified-harbor-rabid.ngrok-free.dev
    routes:
      # SPA fallback — React Router routes like /dashboard must all resolve
      # to index.html client-side, not 404 from the static file server.
      - type: rewrite
        source: /*
        destination: /index.html
